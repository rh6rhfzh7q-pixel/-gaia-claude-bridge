name: G.A.I.A. V4.2 isolated review
on:
  push:
    branches:
      - feature/realtime-tasks-review
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Unit tests (no production database)
        env:
          DATABASE_URL: ''
          GAIA_TEST_DATABASE_URL: ''
        run: npm test
