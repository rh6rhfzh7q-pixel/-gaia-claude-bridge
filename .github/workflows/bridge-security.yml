name: GAIA Bridge Dependency Security

on:
  push:
    branches:
      - main
      - security/bridge-mcp-oct2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/security/bridge-mcp-oct2026'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile with pinned security update
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply safe, semver-compatible transitive patches
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Install clean reproducible dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Validate JavaScript and run security smoke tests
        run: |
          node --check server.js
          npm test
      - name: Publish reviewed lockfile change to isolated branch
        run: |
          git config user.name "gaia-security-ci"
          git config user.email "gaia-security-ci@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update security lockfile [skip ci]"
            git push origin HEAD:security/bridge-mcp-oct2026
          fi
      - name: Report dependency audit
        run: |
          npm audit --json > /tmp/gaia-audit.json || true
          node -e 'const a=require("/tmp/gaia-audit.json"); console.log("Vulnerability summary:",JSON.stringify(a.metadata?.vulnerabilities??{})); for(const [n,v] of Object.entries(a.vulnerabilities??{})){console.log(n, v.severity, "fix:",JSON.stringify(v.fixAvailable), "advisories:",(v.via||[]).filter(x=>typeof x==="object").map(x=>x.url||x.title).join(", "))}'
          npm audit --audit-level=moderate

  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci --ignore-scripts --no-fund
      - name: Validate and test
        run: |
          node --check server.js
          npm test
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
